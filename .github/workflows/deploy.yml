# Builds the website and uploads client/dist to Hostinger over FTP, then checks
# the LIVE site. The API (server/) is NOT touched here: Hostinger deploys that
# by itself from GitHub.
#
# Run it from  GitHub -> Actions -> "Deploy website" -> Run workflow.
# To deploy automatically after every merge that changes client/, set the
# repository variable AUTO_DEPLOY to "true".
#
# One-time setup is in deploy/GITHUB-DEPLOY.md (three secrets: FTP_SERVER,
# FTP_USERNAME, FTP_PASSWORD).
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      indexnow:
        description: "After the live checks pass, also ping Bing/Yandex (IndexNow) with every URL"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy.yml"

# Never run two deploys at once.
concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # The manual button always works; a push only deploys when AUTO_DEPLOY is "true".
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    env:
      # The public address and the API the site talks to. Not secrets.
      VITE_SITE_URL: https://kirannonwovens.com
      VITE_API_URL: https://api.kirannonwovens.com
    steps:
      - name: Check the FTP settings exist
        # Runs before checkout, so the "client" folder does not exist yet.
        working-directory: .
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::The secret $v is not set. Add it in the repository: Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      # Stops a build that would go live pointing at localhost or the wrong host.
      - name: Pre-deploy check
        run: node scripts/predeploy.mjs

      - name: Build (prerenders every page)
        run: npm run build

      - name: Smoke test the build
        run: npm run smoke

      - name: Check the build has the files the server needs
        run: |
          test -f dist/.htaccess || { echo "::error::dist/.htaccess is missing"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml is missing"; exit 1; }
          ls dist/*.txt | grep -Eq '/[0-9a-f]{32}\.txt$' || { echo "::error::the IndexNow key file is missing from dist/"; exit 1; }
          if grep -q localhost dist/sitemap.xml dist/robots.txt; then echo "::error::sitemap or robots.txt mention localhost"; exit 1; fi

      - name: Upload dist/ over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Optional repository variables:
          #   FTP_DIR          the web folder on the server (default: auto, /public_html or /)
          #   FTP_VERIFY_CERT  "false" only if the server's certificate name does not match
          #   FTP_TLS          "false" only if the host cannot do FTPS (sends the password unencrypted)
          FTP_DIR: ${{ vars.FTP_DIR }}
          FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT }}
          FTP_TLS: ${{ vars.FTP_TLS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # A secret pasted with a trailing space or line break is a common reason for
          # "530 Login incorrect": drop CR/LF and surrounding spaces, and say what we see
          # (lengths only, never the values).
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          FTP_SERVER="$(trim "$FTP_SERVER")"; FTP_USERNAME="$(trim "$FTP_USERNAME")"; FTP_PASSWORD="$(trim "$FTP_PASSWORD")"
          echo "Using FTP username of ${#FTP_USERNAME} characters and a password of ${#FTP_PASSWORD} characters."
          case "$FTP_USERNAME$FTP_PASSWORD" in *,*) echo "::warning::The username or password contains a comma, which can confuse FTP tools. Prefer letters and digits only for the FTP password." ;; esac

          TLS="${FTP_TLS:-true}"
          VERIFY="${FTP_VERIFY_CERT:-true}"
          # A certificate is issued to a name, never to an IP address, so when the
          # host is given as an IP only the name check is skipped; the certificate
          # itself is still verified. (FTP_VERIFY_CERT=false turns everything off.)
          CHECK_HOST=yes
          if echo "$FTP_SERVER" | grep -Eq '^(ftps?://)?[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?/?$'; then
            CHECK_HOST=no
            echo "FTP host is an IP address: skipping the hostname check only."
          fi
          SET="set ftp:ssl-force $TLS; set ftp:ssl-protect-data $TLS; set ssl:verify-certificate $VERIFY; set ssl:check-hostname $CHECK_HOST; set net:max-retries 3; set net:timeout 30; set cmd:fail-exit true;"
          lf() { lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$SET $1; quit" "$FTP_SERVER"; }

          ROOT="${FTP_DIR:-}"
          if [ -z "$ROOT" ]; then
            # Some FTP logins start above public_html, some inside it.
            if lf "cls -1 /" | grep -Eq '^/?public_html/?$'; then ROOT=/public_html; else ROOT=/; fi
          fi
          echo "Uploading dist/ to $ROOT on the server"

          # Mirror up, never delete: files that are not in dist/ (for example the
          # Google verification file) are left alone. Hidden files (.htaccess) are included.
          if ! lf "mirror -R --parallel=4 --no-perms --verbose=1 dist/ $ROOT"; then
            echo "::error::The FTP upload failed. If the log says 530 Login incorrect, the FTP_USERNAME or FTP_PASSWORD secret does not match the FTP account in hPanel (Files -> FTP Accounts). Set a new password there and update the secret."
            exit 1
          fi
          echo "Upload finished."

      - name: Check the live site
        run: |
          sleep 15
          node scripts/verify-live.mjs

      - name: Ping IndexNow (Bing, Yandex)
        if: github.event_name == 'workflow_dispatch' && inputs.indexnow
        run: npm run indexnow
