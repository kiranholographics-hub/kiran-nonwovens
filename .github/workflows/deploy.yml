# kirannonwovens.com is ONE Node app on Hostinger: server/ answers /api and
# also serves the built website (client/dist). Hostinger builds and starts it
# by itself from GitHub whenever main changes (root package.json: "npm run
# build", then "npm start"). This workflow does not upload anything. It:
#
#   1. checks the code builds and passes its tests, and
#   2. waits for Hostinger's deploy to go live, checks the LIVE site, and then
#      pings IndexNow (Bing, Yandex) with every URL.
#
# Changes made in the /hq panel (Markets, Pages, Updates...) are downloaded at
# build time, so they go live when Hostinger rebuilds: hPanel -> Websites ->
# kirannonwovens.com -> Redeploy. Then run this workflow by hand
# (Actions -> "Deploy website" -> Run workflow) to check the live site.
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      indexnow:
        description: "After the live checks pass, also ping Bing/Yandex (IndexNow) with every URL"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "package.json"

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same build Hostinger runs (root package.json).
      - name: Build (installs both apps, prerenders every page)
        run: npm run build

      - name: Pre-deploy check
        working-directory: client
        run: node scripts/predeploy.mjs

      - name: Smoke test the build
        working-directory: client
        run: npm run smoke

      - name: API and site tests
        working-directory: server
        run: npm install --no-audit --no-fund && npm test

      - name: Check the build has the files the site needs
        working-directory: client
        run: |
          test -f dist/404.html || { echo "::error::dist/404.html is missing"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml is missing"; exit 1; }
          ls dist/*.txt | grep -Eq '/[0-9a-f]{32}\.txt$' || { echo "::error::the IndexNow key file is missing from dist/"; exit 1; }
          if grep -q localhost dist/sitemap.xml dist/robots.txt; then echo "::error::sitemap or robots.txt mention localhost"; exit 1; fi

      # Hostinger deploys main by itself, which takes a few minutes. The live
      # check passes only once the live home page serves THIS build's bundle,
      # so keep trying for up to ~15 minutes.
      - name: Wait for Hostinger, then check the live site
        if: github.event_name != 'pull_request'
        working-directory: client
        run: |
          for i in $(seq 1 20); do
            if node scripts/verify-live.mjs; then exit 0; fi
            echo "Not live yet (try $i of 20) — waiting 45s for Hostinger's deploy..."
            sleep 45
          done
          echo "::error::The live site never served this build. Check the deploy in hPanel (Websites -> kirannonwovens.com)."
          exit 1

      - name: Ping IndexNow (Bing, Yandex)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.indexnow)
        working-directory: client
        run: npm run indexnow
